name: FloSports
description: 'FloSports is an Austin, Texas-based direct-to-consumer sports media and live-streaming
  company founded in 2006 by brothers Martin and Mark Floreani. It operates a network of vertical
  properties (FloWrestling, FloTrack, FloGrappling, FloRacing, FloHockey, FloRugby, FloFootball and
  more) that deliver live and on-demand event streaming, original programming, news, rankings, and
  results for underserved and passionate sports communities through a subscription model. FloSports
  surfaced in the API Evangelist network as a portfolio company of dcm-ventures; enrichment probing
  found a consumer streaming site with no public developer API, developer portal, OpenAPI, well-known
  discovery documents, or SDK program at this time.'
